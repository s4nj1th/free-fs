name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  packages: write
jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Install protoc & plugins
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Generate proto
        run: |
          protoc \
            --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/free_fs.proto
          go mod tidy
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          go build -ldflags="${LDFLAGS}" \
            -o dist/free-fs-master-${{ matrix.suffix }}${{ matrix.ext || '' }} ./master/
          go build -ldflags="${LDFLAGS}" \
            -o dist/free-fs-chunk-${{ matrix.suffix }}${{ matrix.ext || '' }} ./chunkserver/
      - name: Create archive
        run: |
          cd dist
          tar -czf free-fs-${{ matrix.suffix }}.tar.gz \
            free-fs-master-${{ matrix.suffix }}* \
            free-fs-chunk-${{ matrix.suffix }}*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: dist/*.tar.gz

  docker:
    name: Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/master
            ghcr.io/${{ github.repository }}/chunk
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push master
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.master
          push: true
          tags: ghcr.io/${{ github.repository }}/master:${{ github.ref_name }},ghcr.io/${{ github.repository }}/master:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push chunk
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.chunk
          push: true
          tags: ghcr.io/${{ github.repository }}/chunk:${{ github.ref_name }},ghcr.io/${{ github.repository }}/chunk:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cli
          push: true
          tags: ghcr.io/${{ github.repository }}/cli:${{ github.ref_name }},ghcr.io/${{ github.repository }}/cli:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: "FREE-FS ${{ github.ref_name }}"
          body: |
            ## FREE-FS ${{ github.ref_name }}
            Distributed File System Replica — Google File System architecture, built with Go + gRPC + Docker.
            ### Quick Start
            ```bash
            # Docker (recommended)
            git clone https://github.com/${{ github.repository }}
            cd free-fs
            ./free-fs.sh up
            ./free-fs.sh demo
            ```
            ### Docker Images (GHCR)
            ```bash
            docker pull ghcr.io/${{ github.repository }}/master:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/chunk:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/cli:${{ github.ref_name }}
            ```
            ### Binaries
            Download the pre-built binary for your platform below.
            | Platform | Master | Chunk Server |
            |----------|--------|-------------|
            | Linux x86_64 | `free-fs-master-linux-amd64` | `free-fs-chunk-linux-amd64` |
            | Linux ARM64 | `free-fs-master-linux-arm64` | `free-fs-chunk-linux-arm64` |
            | macOS x86_64 | `free-fs-master-darwin-amd64` | `free-fs-chunk-darwin-amd64` |
            | macOS Apple Silicon | `free-fs-master-darwin-arm64` | `free-fs-chunk-darwin-arm64` |
            | Windows x86_64 | `free-fs-master-windows-amd64.exe` | `free-fs-chunk-windows-amd64.exe` |
            ### Checksums
            See `checksums.txt` attached below.
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
