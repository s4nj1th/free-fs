name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  go-lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Generate proto stubs
        run: |
          protoc \
            --go_out=. \
            --go_opt=paths=source_relative \
            --go-grpc_out=. \
            --go-grpc_opt=paths=source_relative \
            proto/free_fs.proto
      - name: Download dependencies
        run: go mod tidy && go mod download
      - name: Go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    needs: go-lint
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      - name: Install protoc
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Generate proto stubs
        run: |
          protoc \
            --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/free_fs.proto
      - name: Build master
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p dist
          go build -ldflags="-s -w" \
            -o dist/free-fs-node-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/node/
      - name: Build client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -ldflags="-s -w" \
            -o dist/free-fs-client-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/client/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build node image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.node
          push: false
          tags: free-fs-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.client
          push: false
          tags: free-fs-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Start cluster
        run: |
          docker compose -f docker-compose.yml up -d master chunkserver-1 chunkserver-2 chunkserver-3 client
          sleep 15  # Wait for chunk servers to register
      - name: Check cluster status
        run: |
          docker exec free-fs-client-1 /client ls
      - name: Upload test file
        run: |
          echo "Hello FREE-FS! Integration test ${{ github.sha }}" > /tmp/test.txt
          docker cp /tmp/test.txt free-fs-client-1:/tmp/test.txt
          docker exec free-fs-client-1 /client put /tmp/test.txt /ci/test.txt
      - name: Download and verify
        run: |
          docker exec free-fs-client-1 /client get /ci/test.txt /tmp/test_out.txt
          docker cp free-fs-client-1:/tmp/test_out.txt /tmp/test_out.txt
          diff /tmp/test.txt /tmp/test_out.txt && echo "✓ File integrity verified"
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml down -v
