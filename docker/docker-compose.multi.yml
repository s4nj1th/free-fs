version: "3.9"
services:
  master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.master
    ports:
      - "50051:50051"
    environment:
      MASTER_PORT: "50051"
    volumes:
      - free_fs_master_data:/data
    restart: unless-stopped
  chunk:
    build:
      context: ..
      dockerfile: docker/Dockerfile.chunk
    ports:
      - "${CHUNK_PORT:-50052}:50052"
    environment:
      MASTER_ADDR: "${MASTER_IP:-localhost}:50051"
      CHUNK_PORT: "50052"
      SERVER_ID: "${SERVER_ID:-chunk-auto}"
      SELF_ADDR: "${MY_IP:-localhost}:50052"
    volumes:
      - free_fs_chunk_data:/data
    restart: unless-stopped
  cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    environment:
      FREE_FS_MASTER: "${MASTER_IP:-localhost}:50051"
    stdin_open: true
    tty: true
    volumes:
      - ./workspace:/workspace
volumes:
  free_fs_master_data:
  free_fs_chunk_data:
